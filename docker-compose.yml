services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: taskmanagerbe:latest
    container_name: taskmanager-app
    restart: unless-stopped

    environment:
      NODE_ENV: production
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      NODE_PORT: ${NODE_PORT:-8080}

    ports:
      - "${APP_PORT:-8080}:${NODE_PORT:-8080}"

    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://localhost:$${NODE_PORT}/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
